name: CI

# Builds and tests every push to the default branch and every pull request
# targeting it. Release builds (release.yml) are tag-triggered and do not run
# the test suite, so this is the only place the tree is verified before a tag
# is cut.
#
# The jobs, and what each is the only guard against:
#   test      -- go vet, `npm test` (the same command developers run), the
#                embedded defaults mirror, version consistency, release notes
#   web-lint  -- eslint over packages/web
#   go-race   -- data races (`npm test` runs the Go suite without -race)
#   mysql     -- MySQL-specific regressions; CI's copy of ./dev/mysql/test.sh,
#                which CLAUDE.md requires but cannot enforce
#   security  -- known vulnerabilities in Go dependencies and in the
#                production npm tree, on the PR rather than at tag time
#
# `uses:` here is pinned to a major tag, unlike release.yml, which pins every
# action to a commit SHA: this workflow has no write permission to anything,
# and is the one developers read and edit most. Dependabot's github-actions
# ecosystem (.github/dependabot.yml) keeps both up to date.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# A second push to the same PR makes the in-flight run obsolete, so cancel it.
# Pushes to the default branch are NOT cancelled: this workflow is the only
# place the tree is verified before a tag is cut, so every commit that lands on
# the default branch has to be verified on its own, even when several land in a
# row.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # The whole job takes a couple of minutes; anything beyond this is a hang
    # (a wedged `npm ci`, a test waiting on something that never arrives) and
    # should fail fast rather than hold a runner for GitHub's 6 hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/core-go/go.mod
          cache-dependency-path: packages/core-go/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vet Go sources
        working-directory: packages/core-go
        run: go vet ./...

      # The Jira data source sample (DFLT-00088) is its own Go module. Its
      # tests run against an in-memory fake of the Jira API -- CI never talks
      # to a real Jira and needs no credentials. `npm test` below runs them
      # too (npm run test:examples); vetting here keeps a vet failure
      # reported as such.
      - name: Vet the Jira data source sample
        working-directory: examples/jira-datasource
        run: go vet ./...

      # `npm test` runs sync:defaults, then the Go test suite, then each
      # workspace's own tests.
      - name: Test
        run: npm test

      # Deliberately a separate step, and not merged into `npm test`: the
      # web workspace's `vitest` (which `npm test` above already runs) does
      # not type-check anything -- it's Vite's esbuild transform, not tsc.
      # This step's `tsc && vite build` remains the only thing that catches a
      # TypeScript error in packages/web at all.
      - name: Type-check and build web
        run: npm run build --workspace=@graph-ops/web

      # sync:defaults (run by `npm test` above) regenerates the committed
      # mirror under packages/core-go/internal/config/defaults/ from
      # packages/plugin/defaults/. If that leaves the tree dirty, the mirror
      # was committed stale and the built binary would embed outdated node
      # type instructions.
      #
      # `git status --porcelain`, not `git diff`: release.yml builds the binary
      # straight from a clean checkout, so the committed mirror is what gets
      # embedded, and the most likely way for it to go stale is a NEW default
      # file that was never added to the index. `git diff` only reports tracked
      # paths, so it would report a clean tree for exactly that case and ship a
      # binary missing the new node type's instructions. --porcelain lists
      # untracked files too (additions, modifications and deletions alike).
      - name: Check the embedded defaults mirror is in sync
        run: |
          out="$(git status --porcelain -- packages/core-go/internal/config/defaults)"
          if [ -n "$out" ]; then
            echo "packages/core-go/internal/config/defaults is out of sync with packages/plugin/defaults." >&2
            echo "Run 'npm run sync:defaults' and commit the result." >&2
            echo "$out" >&2
            exit 1
          fi

      # The version is hardcoded in 5 places (see scripts/check-versions.js);
      # this catches an update to one location that missed the others before
      # a release tag is ever cut.
      - name: Verify version consistency across 5 locations
        run: npm run check:versions

      # release.yml publishes docs/release-notes/v<version>.md as the Release
      # body; this catches a version bump that forgot its notes.
      - name: Verify release notes exist for the current version
        run: npm run check:release-notes

  web-lint:
    name: Web lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint web
        run: npm run lint --workspace=@graph-ops/web

  # Deliberately a separate job rather than `-race` bolted onto the `test`
  # job's `npm test`: the root `npm test` is the command developers run while
  # working, and the race detector roughly triples its Go leg. CI pays that
  # cost on every PR; local iteration does not (package.json's `test` script
  # stays `-race`-free on purpose).
  go-race:
    name: Go tests (-race)
    runs-on: ubuntu-latest
    # ~90s for all 12 packages on a developer machine; a shared runner with
    # the race detector on is slower, and a hang should still fail fast
    # rather than hold a runner for GitHub's 6 hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/core-go/go.mod
          cache-dependency-path: packages/core-go/go.sum

      # `go test -race` exits non-zero when the detector fires, so a detected
      # race fails this job on its own. Nothing here may soften that (no
      # `|| true`, no `continue-on-error`): the whole point of the job is
      # that a race stops the PR.
      #
      # `-count=1` disables the test cache, and is not optional here.
      # actions/setup-go restores GOCACHE, so without it a package whose
      # sources did not change is reported `(cached)` and the detector never
      # runs over it. That is wrong for this job specifically: a data race is
      # non-deterministic, so re-running an unchanged package is not wasted
      # work -- it is another draw at catching a race that the previous run
      # happened to miss. It also keeps the job honest about doing what its
      # name says (every package, every run). The cost is ~20s on a developer
      # machine and none on the critical path, which is the `mysql` job.
      # dev/mysql/test.sh and the `mysql` job below pass `-count=1` for the
      # same reason.
      - name: Go tests with the race detector
        working-directory: packages/core-go
        run: go test -race -count=1 ./...

  # CI's copy of ./dev/mysql/test.sh, which CLAUDE.md requires for any change
  # to the DB layer but which until now relied on each developer remembering
  # to run it.
  #
  # KEEP THIS JOB AND dev/mysql/test.sh IN SYNC. They cannot share code: that
  # script drives dev/mysql/compose.yaml (a throwaway `CREATE DATABASE` per
  # run, and a CA generated by compose's `certs` service), while a service
  # container is started before the checkout and so can be handed nothing
  # from this repository. What must stay identical is what is actually
  # exercised -- the three package paths, the GRAPH_TEST_MYSQL_* variable
  # names, and `-count=1 -p 1` (the three packages share one database and
  # must not run concurrently). Change either side and change the other.
  mysql:
    name: MySQL store tests
    runs-on: ubuntu-latest
    # Locally one TLS mode over the three packages takes a few minutes; two
    # modes on a shared runner need room.
    timeout-minutes: 30
    env:
      GRAPH_TEST_MYSQL_HOST: 127.0.0.1
      # 13306, not 3306, for the same reason dev/mysql/compose.yaml picks it:
      # the GitHub-hosted runner image ships its own MySQL, and binding the
      # default port would clash with it if it is ever running.
      GRAPH_TEST_MYSQL_PORT: '13306'
      GRAPH_TEST_MYSQL_DATABASE: graph_ops_ci
      GRAPH_TEST_MYSQL_USER: graphops
      GRAPH_TEST_MYSQL_PASSWORD: graphops
      # GRAPH_TEST_MYSQL_TLS_CA is not here: it points into RUNNER_TEMP, and
      # the `runner` context is not available in a job-level `env`. The CA
      # export step below sets it through $GITHUB_ENV instead.
      #
      # The one place the TLS modes are listed. Both the test step and the
      # "really ran against MySQL" step read it, so a mode can never be run
      # without also being checked -- listing them twice is how a mode ends
      # up tested but exempt from the skip check, which is the same hole that
      # check exists to close. Adding verify-full (DFLT-00125) is an edit
      # here and nowhere else in this job.
      GRAPH_CI_MYSQL_TLS_MODES: disabled verify-ca
    services:
      mysql:
        image: mysql:8.4
        # Fixed dev values, the same ones dev/mysql/compose.yaml uses. This
        # container is created and destroyed with the job and holds nothing
        # secret.
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: graph_ops_ci
          MYSQL_USER: graphops
          MYSQL_PASSWORD: graphops
        ports:
          - 13306:3306
        # Same health check as compose.yaml's. The job's steps do not start
        # until it reports healthy, so no polling is needed below.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/core-go/go.mod
          cache-dependency-path: packages/core-go/go.sum

      # A service container starts before this repository is checked out, so
      # it cannot be given the CA that dev/mysql/compose.yaml's `certs`
      # service generates. MySQL 8.4 instead generates its own CA and server
      # certificate into /var/lib/mysql on first start, so copy that CA out
      # of the running container and pin trust to it.
      - name: Export the MySQL server's auto-generated CA
        env:
          # The service container's id, straight from the `job` context --
          # more reliable than matching on image name or port in `docker ps`.
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          set -euo pipefail
          cid="$MYSQL_CONTAINER"
          if [ -z "$cid" ]; then
            echo "The mysql service container has no id; cannot export its CA." >&2
            docker ps >&2
            exit 1
          fi
          ca="$RUNNER_TEMP/mysql-ca.pem"
          docker cp "$cid:/var/lib/mysql/ca.pem" "$ca"
          if [ ! -s "$ca" ]; then
            echo "Copied CA at $ca is empty." >&2
            exit 1
          fi
          echo "GRAPH_TEST_MYSQL_TLS_CA=$ca" >> "$GITHUB_ENV"

      # GRAPH_TEST_MYSQL_TLS is passed explicitly on every run, and must stay
      # that way: left unset, mysqlTestConfig
      # (packages/core-go/internal/store/mysql_test.go) normalizes it to
      # verify-full -- the same secure default a real deployment gets, with
      # no test-only leniency. Dropping it here would not quietly pass; it
      # would fail every connection with an x509 error that reads nothing
      # like "a variable is missing".
      #
      # Which modes run is GRAPH_CI_MYSQL_TLS_MODES above; today that is
      # `disabled` and `verify-ca`. `verify-full` cannot:
      # MySQL's auto-generated server certificate is
      # CN=MySQL_Server_8.4.x_Auto_Generated_Server_Certificate with no
      # subjectAltName at all, so the hostname check fails with
      # "cannot validate certificate for 127.0.0.1 because it doesn't
      # contain any IP SANs". dev/mysql/compose.yaml avoids this by
      # generating a certificate naming localhost and 127.0.0.1, which a
      # service container cannot be given (see above). Getting verify-full
      # -- the production default -- onto CI is DFLT-00125; ./dev/mysql/test.sh
      # covers all three modes locally in the meantime.
      # One step looping the modes, the way dev/mysql/test.sh does, rather
      # than a step per mode: it keeps the mode list in the job `env` alone.
      # `|| status=1` runs every mode even after one fails, so a single run
      # says whether a failure is TLS-specific or not.
      - name: MySQL store tests
        working-directory: packages/core-go
        run: |
          set -o pipefail
          if [ -z "${GRAPH_CI_MYSQL_TLS_MODES// /}" ]; then
            echo "GRAPH_CI_MYSQL_TLS_MODES is empty; no TLS mode would be tested." >&2
            exit 1
          fi
          status=0
          for mode in $GRAPH_CI_MYSQL_TLS_MODES; do
            echo "== TLS mode: $mode"
            GRAPH_TEST_MYSQL_TLS="$mode" \
              go test -count=1 -p 1 -v ./internal/store/ ./internal/httpserver/ ./cmd/graph-engine/ \
              2>&1 | tee "$RUNNER_TEMP/mysql-$mode.log" || status=1
          done
          exit $status

      # Without this the job's real failure mode is a green tick: every
      # MySQL-backed test calls t.Skip when GRAPH_TEST_MYSQL_HOST is unset,
      # so one typo in a variable name above would run the SQLite suite,
      # skip everything MySQL, and pass.
      #
      # Negative check: every one of those skips begins with
      # "GRAPH_TEST_MYSQL_HOST not set" (three sites --
      # internal/store/mysql_test.go,
      # internal/store/claim_concurrency_mysql_test.go and
      # cmd/graph-engine/ticket_delete_update_cli_test.go). A single such
      # line means this job verified nothing. Note it is these skips that are
      # counted, not `--- SKIP` in general: internal/httpserver has skips that
      # fire only when the tests run as root, which have nothing to do with
      # MySQL.
      #
      # Positive check: counts drawn ONLY from tests that actually connect.
      #   * `--- PASS: <name>/mysql` -- the per-backend subtests in
      #     internal/store and cmd/graph-engine.
      #   * `--- PASS: TestMySQLRepository_*` -- internal/store's MySQL-only
      #     tests.
      # internal/httpserver is deliberately excluded from both: it has no
      # MySQL-backed test at all (its one GRAPH_TEST_MYSQL* mention,
      # app_settings_test.go's undefined-variable expansion test, never opens
      # a connection). A floor taken over the whole suite instead would be
      # cleared by its hundreds of SQLite tests with MySQL switched off
      # entirely, which is exactly the hole this step exists to close.
      #
      # Measured 2026-09-21 against a mysql:8.4 service container, identical
      # in both TLS modes: 52 `/mysql` subtests (20 in internal/store, 32 in
      # cmd/graph-engine) and 10 TestMySQLRepository_* passes. The floors
      # below sit under those so adding tests never trips them. If a refactor
      # legitimately removes MySQL-backed tests, lower these numbers
      # deliberately (and say so) -- do not delete the check.
      - name: Check the tests really ran against MySQL
        run: |
          set -euo pipefail
          min_backend_subtests=40
          min_repository_tests=7
          if [ -z "${GRAPH_CI_MYSQL_TLS_MODES// /}" ]; then
            echo "GRAPH_CI_MYSQL_TLS_MODES is empty; there is nothing to check." >&2
            exit 1
          fi
          status=0
          for mode in $GRAPH_CI_MYSQL_TLS_MODES; do
            log="$RUNNER_TEMP/mysql-$mode.log"
            if [ ! -s "$log" ]; then
              echo "$log is missing or empty; the test step did not produce a log." >&2
              status=1
              continue
            fi
            skipped="$(grep -c 'GRAPH_TEST_MYSQL_HOST not set' "$log" || true)"
            subtests="$(grep -c -- '--- PASS: .*/mysql' "$log" || true)"
            repotests="$(grep -c -- '--- PASS: TestMySQLRepository_' "$log" || true)"
            echo "$log: $skipped MySQL skips, $subtests /mysql subtests passed, $repotests TestMySQLRepository_* passed"
            if [ "$skipped" -ne 0 ]; then
              echo "$log: $skipped test(s) skipped with 'GRAPH_TEST_MYSQL_HOST not set'; the GRAPH_TEST_MYSQL_* variables did not reach the tests." >&2
              status=1
            fi
            if [ "$subtests" -lt "$min_backend_subtests" ]; then
              echo "$log: only $subtests '/mysql' subtests passed, expected at least $min_backend_subtests." >&2
              status=1
            fi
            if [ "$repotests" -lt "$min_repository_tests" ]; then
              echo "$log: only $repotests TestMySQLRepository_* tests passed, expected at least $min_repository_tests." >&2
              status=1
            fi
          done
          exit $status

  security:
    name: Vulnerability scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Deliberately NOT `go-version-file: packages/core-go/go.mod` -- the
      # same trap release.yml's `vulncheck` job documents at length. setup-go
      # sets GOTOOLCHAIN=local, and govulncheck v1.8.0 needs go >= 1.26, so
      # `go install` below fails outright under the pinned go1.25.14. This Go
      # only runs the scanner; the toolchain that builds what users run is
      # pinned by the `test` job here and by release.yml's `build` job. Do
      # not "fix" this back to go-version-file.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # Pinned, and to the same version release.yml installs: CI must not
      # start failing because a tool nobody has seen before shipped a new
      # check. Bumping it is a deliberate edit in both files.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      # Blocking on purpose. release.yml scans the built binaries, which only
      # happens once a tag is cut -- by then the vulnerable dependency has
      # been on the default branch for however long. This finds it on the PR
      # that introduces it.
      - name: Scan packages/core-go
        working-directory: packages/core-go
        run: govulncheck ./...

      # Its own Go module (DFLT-00088), with its own gomod entry in
      # .github/dependabot.yml, so it gets its own scan.
      - name: Scan the Jira data source sample
        working-directory: examples/jira-datasource
        run: govulncheck ./...

      # Reads package-lock.json; no `npm ci` needed.
      #
      # `--omit=dev` because the production dependency tree is what ships --
      # a dev-only advisory (SEC-13's vitest, which the npm Dependabot
      # updates handle) must not block unrelated PRs. Blocking, and
      # deliberately not softened with --audit-level: the count was 0 when
      # this landed, so the first finding here is a real change. When a new
      # advisory does turn this red, land the dependency update rather than
      # adding an exception.
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev
