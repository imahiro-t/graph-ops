name: Release graph-engine binaries

# Cross-compiles the packages/core-go Go binary (no CGO required) for every
# platform the plugin's scripts/install-binary.js knows how to fetch, and
# attaches the results to a GitHub Release. The release tag MUST be
# "v<version>" where <version> matches packages/plugin/.claude-plugin/
# plugin.json's "version" field -- install-binary.js downloads assets from
# exactly that tag, so a plugin version and its release tag must always be
# bumped together (see README's versioning note).
#
# The web UI is embedded into every binary: the `web` job builds it once,
# and each `build` job puts that output into
# packages/core-go/internal/httpserver/webdist/ (which `//go:embed`s it, and
# which git tracks only as an empty .gitkeep) and checks it is really there
# BEFORE running `go build`. Without that, the binaries would silently ship
# with no index.html / assets at all.
#
# The web build installs its dependencies with `npm ci --ignore-scripts`, so
# no package's install script runs on the release runner. (Using npm in CI
# at all is out of scope here; what matters is that the plugin itself is no
# longer distributed through npm.) `npm run build:web` still executes
# dependency code (tsc, vite and its plugins), though, so the workflow is
# locked down around that:
#   - The workflow-wide token is read-only (`contents: read`). Only the
#     `release` job, which runs no npm code at all, gets `contents: write`.
#     A compromised build dependency in `web` therefore cannot move a v* tag
#     or rewrite a Release (and its checksums.txt) -- which would otherwise
#     reach every user whose command clones that tag.
#   - `web` and `build` check out with `persist-credentials: false`, so the
#     token is not left in .git/config for later steps to read. Neither job
#     uses git auth after checkout.
#   - Neither npm nor Go caches are used: setup-node runs without
#     `cache: npm` and with `package-manager-cache: false`, and setup-go
#     runs with `cache: false`. A tag-triggered workflow can read caches
#     saved by the default branch, and a release build should not trust
#     them.
#   - Every job has a `timeout-minutes`, so a hang (e.g. a wedged `npm ci`)
#     fails fast instead of holding a runner for GitHub's 6 hour default.
#
# The `web` job checks, before any binary is built, that the tag matches
# plugin.json's "version" and that docs/release-notes/<tag>.md exists. Both
# are release-blocking: `build` needs `web`.
#
# Every `uses:` below is pinned to a commit SHA, with the version in a
# trailing comment, because a mutable major tag lets whoever can move it run
# their code in this workflow -- including in the `release` job, the one with
# `contents: write` over this repository's tags and Releases. ci.yml stays on
# tags on purpose (it has no write permission and is the workflow developers
# read most); Dependabot's github-actions ecosystem
# (.github/dependabot.yml) updates the pins here.
#
# Before any of it is published, the `vulncheck` job scans the binaries the
# `build` jobs produced: each one must have been built with at least the Go
# version pinned in packages/core-go/go.mod's `toolchain` line, and
# `govulncheck -mode=binary` must report nothing reachable from its code. The
# `release` job needs `vulncheck`, so a binary with a reachable vulnerability
# never reaches a Release. The scan first checks it found exactly the 4
# expected binaries: a download pattern that stops matching must fail the job,
# not pass it having scanned nothing. It is a separate job rather than a step
# in `build` so that the job producing the published binaries runs no extra
# third-party code, and it installs a pinned govulncheck rather than @latest.
# That job runs a newer Go than the pinned toolchain on purpose (govulncheck
# needs it to build, and the version that scans a binary is independent of the
# version that built it); only `build` follows packages/core-go/go.mod.
#
# Also publishes a checksums.txt (plain `sha256sum` output) covering every
# binary asset. install-binary.js fetches this alongside the binary and
# refuses to install anything whose SHA256 doesn't match -- see that
# script's downloadAndVerify() -- so this file is a required release asset,
# not an optional extra: a release missing it makes every fresh
# install/update fail (or fall back to a stale cached binary, if any).
#
# The repo-root THIRD_PARTY_NOTICES file (third-party license notices for
# packages/core-go's statically-linked Go dependencies) is uploaded as its
# own build artifact by the `web` job (the only early job with the repo
# checked out) and attached to the Release by the `release` job as a
# separate asset, outside dist/ so it never enters checksums.txt.
on:
  push:
    tags:
      - 'v*'

# Read-only by default; only the `release` job below gets `contents: write`.
permissions:
  contents: read

jobs:
  web:
    name: Build web UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # No `cache: npm`, and `package-manager-cache: false`, on purpose (see
      # the header comment).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      # The tag and packages/plugin/.claude-plugin/plugin.json's "version" must
      # agree: install-binary.js downloads assets from exactly "v<version>", so
      # a Release cut from a mismatched tag produces binaries no installed
      # plugin will ever fetch. This used to be a manual pre-flight check in
      # RELEASING.md (`npm run check:versions` verifies the 5 in-tree copies
      # agree with each other, but never looks at the tag string). It runs in
      # the `web` job, which every `build` job needs, and before anything is
      # installed or built, so a mismatched tag costs seconds and produces no
      # binary at all. The tag name is passed through env so the shell never
      # interprets it.
      - name: Check the tag matches the plugin version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./packages/plugin/.claude-plugin/plugin.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match packages/plugin/.claude-plugin/plugin.json version $version (expected tag v$version)." >&2
            echo "Delete the tag, fix the version (npm run check:versions covers all 5 in-tree locations), and tag again." >&2
            exit 1
          fi
          echo "Tag $TAG matches plugin version $version."

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build web UI
        run: npm run build:web

      - name: Check the web UI build output
        run: |
          dir=packages/web/dist
          if [ ! -f "$dir/index.html" ] || [ ! -d "$dir/assets" ] || [ -z "$(find "$dir/assets" -type f | head -n 1)" ]; then
            echo "$dir is missing index.html or has no files under assets/." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: webdist
          path: packages/web/dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: third-party-notices
          path: THIRD_PARTY_NOTICES

      # The Release body is docs/release-notes/<tag>.md. Fail here, before any
      # binary is built, if the tagged commit has no notes for this tag. The
      # tag name is passed through env so the shell never interprets it.
      - name: Check the release notes for this tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/release-notes/$TAG.md"
          if [ ! -f "$notes" ] || [ -z "$(tr -d '[:space:]' < "$notes")" ]; then
            echo "$notes is missing or empty; every release must have release notes." >&2
            exit 1
          fi
          cp "$notes" RELEASE_NOTES.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          # Keep this list in sync with ASSET_NAME_BY_TARGET in
          # packages/plugin/scripts/install-binary.js.
          - goos: darwin
            goarch: amd64
            asset: graph-engine-darwin-amd64
          - goos: darwin
            goarch: arm64
            asset: graph-engine-darwin-arm64
          - goos: linux
            goarch: amd64
            asset: graph-engine-linux-amd64
          - goos: windows
            goarch: amd64
            asset: graph-engine-windows-amd64.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # `cache: false` on purpose (see the header comment).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: packages/core-go/go.mod
          cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: webdist
          path: packages/core-go/internal/httpserver/webdist

      - name: Check the web UI is in place for embedding
        run: |
          dir=packages/core-go/internal/httpserver/webdist
          if [ ! -f "$dir/index.html" ] || [ ! -d "$dir/assets" ] || [ -z "$(find "$dir/assets" -type f | head -n 1)" ]; then
            echo "$dir is missing index.html or has no files under assets/; refusing to build a binary without the web UI." >&2
            exit 1
          fi

      - name: Build graph-engine
        working-directory: packages/core-go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -o "../../dist/${{ matrix.asset }}" ./cmd/graph-engine

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  vulncheck:
    name: Scan release binaries for known vulnerabilities
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Checked out only for packages/core-go/go.mod: the scan below reads its
      # `toolchain` line to know which Go version the binaries must have been
      # built with.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Deliberately NOT `go-version-file: packages/core-go/go.mod` here: this
      # Go only runs the scanner, and the binaries under test carry their own
      # build version, so the two need not match. govulncheck itself requires
      # a newer Go than the pinned toolchain (x/vuln v1.8.0 needs go >= 1.26),
      # and setup-go sets GOTOOLCHAIN=local, so building it with the pinned
      # go1.25.14 fails at `go install`. Do not "fix" this back to
      # go-version-file -- the `build` job above is the one that must follow
      # the go.mod pin, because it produces what users run.
      # `cache: false` on purpose (see the header comment).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false

      # Only the binaries -- the same pattern the `release` job uses, so this
      # job scans exactly the set of files that gets published.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: graph-engine-*
          path: dist
          merge-multiple: true

      # Pinned, not `@latest`: a release must not run a version of this tool
      # that nobody has seen before.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Scan every release binary
        run: |
          set -euo pipefail

          # A glob or a download pattern that matches nothing would make the
          # loop below run zero times and let this job pass without having
          # scanned anything, so the count is checked first: exactly one
          # binary per entry of the `build` matrix.
          expected=4
          if [ ! -d dist ]; then
            echo "dist/ does not exist; no release binary was downloaded." >&2
            exit 1
          fi
          binaries="$(find dist -maxdepth 1 -type f -name 'graph-engine-*' | sort)"
          found="$(printf '%s\n' "$binaries" | grep -c . || true)"
          if [ "$found" -ne "$expected" ]; then
            echo "Expected $expected release binaries under dist/, found $found:" >&2
            echo "$binaries" >&2
            exit 1
          fi

          # The Go version every binary must have been built with, at minimum.
          # This is the pin: without the toolchain line, setup-go builds with
          # the `go` directive's version (go1.25.0 shipped the binaries of
          # v0.6.0, which had 27 reachable standard library vulnerabilities).
          min_go="$(awk '/^toolchain /{print $2; exit}' packages/core-go/go.mod)"
          if [ -z "$min_go" ]; then
            echo "packages/core-go/go.mod has no toolchain line; refusing to publish binaries built with an unpinned Go toolchain." >&2
            exit 1
          fi

          # Every binary is checked before the job fails, so a single run
          # reports all of the bad ones instead of only the first.
          failed=""
          scanned=0
          while IFS= read -r binary; do
            echo "::group::$binary"
            ok=1

            built_with="$(go version "$binary" | awk '{print $2}')"
            echo "built with ${built_with:-(unknown)}, minimum $min_go"
            if [ -z "$built_with" ] || ! printf '%s\n%s\n' "${min_go#go}" "${built_with#go}" | sort -V -C; then
              echo "$binary was built with ${built_with:-(unknown)}, older than the pinned $min_go." >&2
              ok=0
            fi

            if ! govulncheck -mode=binary "$binary"; then
              echo "$binary has known vulnerabilities reachable from its code." >&2
              ok=0
            fi

            [ "$ok" -eq 1 ] || failed="$failed $binary"
            scanned=$((scanned + 1))
            echo "::endgroup::"
          done <<< "$binaries"

          if [ "$scanned" -ne "$expected" ]; then
            echo "Only scanned $scanned of $expected binaries." >&2
            exit 1
          fi
          if [ -n "$failed" ]; then
            echo "Refusing to publish. Failed binaries:$failed" >&2
            exit 1
          fi
          echo "Scanned $scanned binaries: all built with $min_go or newer, none with reachable vulnerabilities."

  release:
    name: Publish GitHub Release
    needs: [build, vulncheck]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that can write to the repository (tags / Releases). It
    # checks nothing out and runs no npm or other third-party build code.
    permissions:
      contents: write
    steps:
      # Only the binaries: without the pattern, the `webdist` artifact would be
      # merged into dist/ too, and end up in checksums.txt and the Release.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: graph-engine-*
          path: dist
          merge-multiple: true

      - name: Compute checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      # Downloaded into a separate directory (not dist/) so it never enters
      # checksums.txt or affects the pattern-based binaries download above.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: third-party-notices
          path: notices

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-notes
          path: release-notes

      - name: Create release and upload assets
        # The tag name is passed through env rather than expanded into the
        # script, so nothing in it is ever interpreted by the shell.
        # --generate-notes appends GitHub's generated notes (PR list and the
        # "Full Changelog" link) after the hand-written notes.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/* notices/THIRD_PARTY_NOTICES \
            --repo "$REPO" \
            --title "$TAG" \
            --notes-file release-notes/RELEASE_NOTES.md \
            --generate-notes
