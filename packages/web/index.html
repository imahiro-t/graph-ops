<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!--
      Defense in depth, not the primary defense (DFLT-00103). What it buys:
      artifact markdown is agent-authored, and this keeps the page from
      reaching out to an origin nobody chose -- no external image, font,
      stylesheet or fetch -- so viewing an artifact cannot become a signal
      to a third party.

      Notes on the specific directives:
        - frame-ancestors is deliberately absent: it is ignored in a <meta>
          CSP. Clickjacking is handled by the server's own response headers
          (internal/httpserver's withSecurityHeaders), which is the only
          place it can be.
        - script-src / style-src need 'unsafe-inline': the theme script just
          below runs inline, and both Vite's dev server and Tailwind inject
          inline styles. Hashing is not an option when the build generates
          them.
        - connect-src allows ws: for Vite's HMR socket in `npm run dev`; the
          built single-binary server never opens one.
        - img-src has no external origin, which is the point: a remote <img>
          in an artifact is what MarkdownViewer makes click-to-load, and
          this is the backstop for any other path to one.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GraphOps Console</title>
    <script>
      // Applies the persisted theme (see src/hooks/useTheme.ts) before the
      // stylesheet paints, so the page never flashes the wrong mode on load.
      (function () {
        try {
          var stored = localStorage.getItem('graph-ops-theme');
          var isDark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
