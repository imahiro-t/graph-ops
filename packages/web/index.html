<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!--
      Defense in depth, not the primary defense (DFLT-00103). What it buys:
      artifact markdown is agent-authored, and this keeps the page from
      reaching out to an origin nobody chose for anything the reader did not
      ask for -- no external font, stylesheet or fetch -- so viewing an
      artifact cannot quietly become a signal to a third party.

      Notes on the specific directives:
        - frame-ancestors is deliberately absent: it is ignored in a <meta>
          CSP. Clickjacking is handled by the server's own response headers
          (internal/httpserver's withSecurityHeaders), which is the only
          place it can be.
        - script-src / style-src need 'unsafe-inline': the theme script just
          below runs inline, and both Vite's dev server and Tailwind inject
          inline styles. Hashing is not an option when the build generates
          them.
        - connect-src is 'self' alone. It used to also carry `ws: wss:` for
          Vite's HMR socket in `npm run dev`, but those are scheme-only
          sources and so allowed a WebSocket to *any* host -- the one hole in
          an otherwise closed set of outbound directives, and the layer that
          would matter most given 'unsafe-inline' above. CSP3 matches a
          same-origin ws(s) URL against 'self', which is what HMR opens
          (verified against `npm run dev`), so nothing was lost by dropping
          them.
        - img-src allows https:, and that is deliberate rather than an
          oversight. The rule that a remote image is not fetched just because
          an artifact was rendered is enforced in MarkdownViewer, which shows
          the image's host and fetches nothing until the reader clicks (see
          RemoteImage). A CSP that forbade external images outright would not
          add a second layer to that rule -- it would cancel it, leaving a
          button that does nothing. https: keeps this directive doing the one
          job it can still do here: an image the reader did ask for may not
          travel in cleartext, and every other external source stays blocked.
          MarkdownViewer knows this limit and offers a non-https remote image
          as a link instead of an <img> it knows the browser would refuse.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <!--
      No Referer on anything this page causes to be requested, remote images
      included: the URL of an artifact preview names the artifact being read,
      and that is not something to hand to whoever hosts an image inside it.
      The server sends the same policy as a real header on every response
      (withSecurityHeaders); this covers `npm run dev`, where Vite serves
      this file instead.
    -->
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GraphOps Console</title>
    <script>
      // Applies the persisted theme (see src/hooks/useTheme.ts) before the
      // stylesheet paints, so the page never flashes the wrong mode on load.
      (function () {
        try {
          var stored = localStorage.getItem('graph-ops-theme');
          var isDark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
